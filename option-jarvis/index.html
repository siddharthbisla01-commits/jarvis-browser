<!DOCTYPE html>
<html>
<head>
  <title>Option Jarvis Advisor</title>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px;
    }
    #chat {
      width: 80%;
      height: 300px;
      margin: 20px auto;
      border: 1px solid #ccc;
      padding: 10px;
      overflow-y: scroll;
      background: #f9f9f9;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1>🪄 Option Jarvis Advisor</h1>
  <p>This Jarvis only <b>advises</b> you on options. It never executes trades.</p>

  <div id="chat"></div>

  <input type="text" id="userInput" placeholder="Ask Jarvis something..." style="width:80%; padding:10px">
  <button onclick="askJarvis()">Ask Jarvis</button>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("userInput");

    function say(msg) {
      const p = document.createElement("p");
      p.style.textAlign = "left";
      p.innerHTML = `<b>Jarvis:</b> ${msg}`;
      chat.appendChild(p);
      chat.scrollTop = chat.scrollHeight;
    }

    function you(msg) {
      const p = document.createElement("p");
      p.style.textAlign = "right";
      p.innerHTML = `You: ${msg}`;
      chat.appendChild(p);
      chat.scrollTop = chat.scrollHeight;
    }

    function askJarvis() {
      const question = input.value.trim();
      if (!question) return;

      you(question);
      input.value = "";

      // Jarvis logic (simple example)
      if (question.toLowerCase().includes("buy call") || 
          question.toLowerCase().includes("buy option")) {
        say("Jarvis suggests: " +
            "If Nifty is above 22,000 and trend is bullish, "+
            "consider buying a slightly OTM call with strike near current ATM. "+
            "Place stop‑loss at 10% below entry and a target near 15–20%. "+
            "Do not risk more than 2% of your capital on one option.");
      } else if (question.toLowerCase().includes("sell") || 
                 question.toLowerCase().includes("exit")) {
        say("Jarvis suggests: " +
            "You can exit the call when either your target is hit or " +
            "your stop‑loss is triggered. " +
            "Avoid holding options till expiry if premium becomes very low.");
      } else {
        say("Jarvis can advise you on: " +
            "where to buy options, where to sell options, " +
            "and risk‑to‑reward ideas. " +
            "Ask something like: 'Jarvis, should I buy Nifty call today?'");
      }
    }

    // Start
    say("Jarvis is ready. Ask me about options advice.");
  </script>
</body>
</html>
